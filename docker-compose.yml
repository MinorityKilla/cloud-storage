services:
  postgres:
    image: postgres:17
    container_name: cloud_postgres
    environment:
      POSTGRES_DB: cloud_storage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 7994821Kk.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_storage"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cloud_storage_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloud_storage
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 7994821Kk.
    ports:
      - "5555:5555"
    volumes:
      - uploads:/uploads

volumes:
  postgres_data:
  uploads: